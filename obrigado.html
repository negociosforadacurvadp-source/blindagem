<script>
/* Evento de inscrição confirmada: dispara só aqui, na página de obrigado */
(function(){
  var PIXEL='1509875777101544';
  function fb(){ if(window.fbq) fbq.apply(null, arguments); }
  var enc=new TextEncoder();
  async function sha(v){
    if(!v||!window.crypto||!crypto.subtle) return undefined;
    var buf=await crypto.subtle.digest('SHA-256', enc.encode(String(v).trim().toLowerCase()));
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
  }
  var raw=null;
  try{ raw=sessionStorage.getItem('bz_lead'); sessionStorage.removeItem('bz_lead'); }catch(e){}
  if(!raw) return; // recarregar ou acesso direto não gera evento duplicado
  var d=JSON.parse(raw);
  var ph=d.whatsapp? '55'+d.whatsapp.replace(/\D/g,'') : '';
  Promise.all([sha(d.email), sha(ph)]).then(function(h){
    var um={};
    if(h[0]) um.em=h[0];
    if(h[1]) um.ph=h[1];
    if(Object.keys(um).length) fb('init',PIXEL,um);
    var params={content_name:'Blindagem Empresarial 2027', funcionarios:d.funcionarios||'', origem:d.origem||'', status:true};
    fb('track','Lead',params);
    fb('track','CompleteRegistration',params);
    fb('trackCustom','InscricaoConfirmada',Object.assign({}, params, d.utm||{}));
  });
})();
</script>
